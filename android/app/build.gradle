plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claire.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.claire.companion"
        minSdk 24
        targetSdk 35
        // 0.4.0 is the always-on build: Material UI, continuous location and
        // autonomous capture.  The version is on screen in the app's header,
        // because "which APK is actually on the phone" is otherwise only ever a
        // guess.
        versionCode 4
        versionName "0.4.0"
        // The instrumentation tests (androidTest) are not decoration: this phone
        // refuses `adb shell input` outright (MIUI strips INJECT_EVENTS from the shell
        // user), so a long press and a screen that only opens from a tap cannot be
        // exercised from a terminal at all.  A test that runs inside the app's own
        // process is the only way to observe them.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // No signing config: the debug build is signed with this machine's
            // auto-generated debug keystore (~/.android/debug.keystore), which is
            // what makes assembleDebug produce an installable APK without any key
            // material in the repository.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // The version is shown on screen ("which APK is on the phone is otherwise a
        // guess"), and BuildConfig.VERSION_NAME is where it comes from.  AGP 8 turns
        // this off by default.
        buildConfig true
    }

    lint {
        // The APK must build without a human triaging warnings.
        abortOnError false
    }
}

dependencies {
    // Material Components, so the screens are built out of the design system
    // (MaterialToolbar, MaterialCardView, MaterialSwitch, TextInputLayout,
    // Snackbar) instead of hand-rolled LinearLayouts.  1.12.0 is the newest
    // release whose AAR metadata accepts compileSdk 35 + AGP 8.5.2; it brings
    // Material 3 themes, which is what the app theme is now built on.
    implementation 'com.google.android.material:material:1.12.0'
    // The screens are ConstraintLayout-based, which is what lets the status
    // header collapse gracefully on a small screen and keeps the conversation
    // list the only flexible row.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // The activities stay AppCompat activities (Material3 themes extend
    // AppCompat, and CameraX's bindToLifecycle needs a LifecycleOwner).
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CameraX, pinned to 1.4.2.  This is not a guess: 1.4.2 is the newest release
    // whose AAR metadata still accepts this toolchain.  1.5.3 requires AGP 8.6.0
    // and 1.6.x requires compileSdk 36; 1.4.2's metadata asks for
    // minCompileSdk=34 and minAndroidGradlePluginVersion=1.0.0, both of which
    // compileSdk 35 + AGP 8.5.2 satisfy.  It is also already in this machine's
    // Gradle cache, so "camera at will" costs no download.
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ProcessCameraProvider.getInstance() hands back a ListenableFuture, and the type
    // has to be nameable at compile time.  Declared explicitly rather than relied on
    // transitively: camera-core's own dependency on it is a compile-scope POM
    // dependency, and a future CameraX patch could narrow that to implementation and
    // turn this into a build error with nothing pointing at the cause.  The artifact is
    // one interface and is already in the Gradle cache.
    implementation 'com.google.guava:listenablefuture:1.0'

    // Instrumentation tests, for the two things a shell on this phone cannot do:
    // a long press (MIUI denies INJECT_EVENTS to the adb user) and the Settings
    // screen (not exported, so only something inside this app can open it).
    // androidTest-only: none of this is in the shipped APK.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
