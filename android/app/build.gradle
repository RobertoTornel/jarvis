plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claire.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.claire.companion"
        minSdk 24
        targetSdk 35
        // 0.3.0 is the always-listening build.  The version is on screen in the
        // app's header, because "which APK is actually on the phone" is otherwise
        // only ever a guess.
        versionCode 3
        versionName "0.3.0"
    }

    buildTypes {
        debug {
            // No signing config: the debug build is signed with this machine's
            // auto-generated debug keystore (~/.android/debug.keystore), which is
            // what makes assembleDebug produce an installable APK without any key
            // material in the repository.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The APK must build without a human triaging warnings.
        abortOnError false
    }
}

dependencies {
    // The UI is appcompat (AppCompatActivity: a LifecycleOwner without which
    // CameraX's bindToLifecycle has nothing to bind to) plus a plain
    // RecyclerView for the conversation list.  No Material Components and no
    // ConstraintLayout: both would be extra AARs for layouts a LinearLayout
    // already expresses, and every AAR is another piece of AAR metadata that has
    // to agree with compileSdk 35 and AGP 8.5.2.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CameraX, pinned to 1.4.2.  This is not a guess: 1.4.2 is the newest release
    // whose AAR metadata still accepts this toolchain.  1.5.3 requires AGP 8.6.0
    // and 1.6.x requires compileSdk 36; 1.4.2's metadata asks for
    // minCompileSdk=34 and minAndroidGradlePluginVersion=1.0.0, both of which
    // compileSdk 35 + AGP 8.5.2 satisfy.  It is also already in this machine's
    // Gradle cache, so "camera at will" costs no download.
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ProcessCameraProvider.getInstance() hands back a ListenableFuture, and the type
    // has to be nameable at compile time.  Declared explicitly rather than relied on
    // transitively: camera-core's own dependency on it is a compile-scope POM
    // dependency, and a future CameraX patch could narrow that to implementation and
    // turn this into a build error with nothing pointing at the cause.  The artifact is
    // one interface and is already in the Gradle cache.
    implementation 'com.google.guava:listenablefuture:1.0'
}
