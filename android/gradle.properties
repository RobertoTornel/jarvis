org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is in play: CameraX (camera-core / camera-camera2 / camera-lifecycle /
# camera-view), appcompat (the activity + LifecycleOwner this app is built on)
# and recyclerview (the conversation list).  This property is required or the
# build fails outright on any AndroidX dependency.
android.useAndroidX=true
android.enableJetifier=false

# This app is built with the AGP already cached on this laptop (8.5.2), which was
# tested up to compileSdk 34.  compileSdk 35 is installed and is what we build
# against, so the warning is expected and suppressed on purpose.
android.suppressUnsupportedCompileSdk=35

# No build cache server, no parallel module graph (there is one module).
org.gradle.parallel=false
org.gradle.caching=false
