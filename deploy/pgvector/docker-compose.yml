# Reproduces the running claire-pg container (pgvector/pgvector:pg17, PostgreSQL 17.11 + pgvector 0.8.7).
#
# The password is NOT stored here. It comes from the environment variable
# CLAIRE_PG_PASSWORD, which is defined in ~/.config/claire/pg.env
# (variable name: CLAIRE_PG_PASSWORD). Source that file before running docker compose, e.g.:
#
#   set -a; . ~/.config/claire/pg.env; set +a
#   docker compose -f deploy/pgvector/docker-compose.yml up -d
#
# Never commit the real password to this file.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: claire-pg
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: claire
      POSTGRES_DB: claire
      POSTGRES_PASSWORD: ${CLAIRE_PG_PASSWORD:?set CLAIRE_PG_PASSWORD (source ~/.config/claire/pg.env first)}
    volumes:
      - claire-pgdata17:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claire -d claire"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  claire-pgdata17:
    name: claire-pgdata17
    driver: local
