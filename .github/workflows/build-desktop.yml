name: Build Desktop Apps

on:
  workflow_call:
    inputs:
      version:
        description: 'App version string (e.g. "1.2.3" or "dev-a1b2c3d")'
        required: true
        type: string
      channel:
        description: 'Release channel (stable / develop)'
        required: true
        type: string
      smoke_test:
        description: 'Run --smoke-test after each build'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-desktop-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  # ── Linux: build + optional smoke test ──────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🧹 Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          # libegl1/libgl1: Qt6 (even the offscreen/xcb platform plugins) dlopens
          # libEGL.so.1/libGL.so.1 at import time; without them the bundled app
          # dies with "ImportError: libEGL.so.1: cannot open shared object file"
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 portaudio19-dev binutils
          # xvfb is needed for smoke tests (virtual framebuffer for Qt)
          if [ "${{ inputs.smoke_test }}" = "true" ]; then
            sudo apt-get install -y xvfb
          fi

      - name: 📝 Generate version file
        run: |
          cat > src/claire/_version.py << EOF
          # Auto-generated at build time
          VERSION = "${{ inputs.version }}"
          RELEASE_CHANNEL = "${{ inputs.channel }}"
          EOF
          echo "Generated version file with VERSION=${{ inputs.version }}, RELEASE_CHANNEL=${{ inputs.channel }}"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(chatterbox-tts|mlx-whisper)' requirements.txt > requirements-desktop.txt
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: 🎨 Generate icons
        run: |
          python src/desktop_app/desktop_assets/generate_icons.py

      - name: 🔨 Build executable
        run: |
          pyinstaller claire.spec

      - name: 🔍 Smoke test bundled app
        if: inputs.smoke_test
        run: |
          echo "═══════════════════════════════════════════"
          echo " Smoke Test: Claire Desktop (Linux)"
          echo "═══════════════════════════════════════════"
          xvfb-run --auto-servernum dist/Claire/Claire --smoke-test
          echo "✅ Smoke test passed"

      - name: 📦 Package Linux build
        if: always()
        run: |
          cd dist
          tar -czf Claire-Linux-x64.tar.gz Claire/

      - name: 📤 Upload Linux artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Claire-Linux
          path: dist/Claire-Linux-x64.tar.gz
